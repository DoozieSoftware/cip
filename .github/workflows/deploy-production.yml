name: Deploy to Production

on:
  # Production is released only after the canonical CI workflow has
  # completed successfully on the main branch. A direct push to main can no
  # longer bypass the CI gate.
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  PHP_VERSION: "8.4"
  NODE_VERSION: "20"
  BACKEND_DIR: backend
  FRONTEND_DIR: frontend

jobs:
  deploy:
    name: Build & Deploy
    # Scheduled CI is a diagnostic full-suite audit, not a release event.
    # Only a successful push to main may open the production deploy gate;
    # otherwise a red nightly audit can block an already-green release and a
    # green nightly audit could deploy without a new push.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Guard against destructive production DB commands
        run: |
          destructive_migrate="migrate:""fresh"
          destructive_wipe="db:""wipe"
          if grep -RInE "$destructive_migrate|$destructive_wipe" .github/workflows deploy; then
            echo "Destructive production database command detected. Use php artisan migrate --force only."
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: bcmath, exif, gd, intl, mbstring, pdo_mysql, zip
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Install frontend dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run build

      - name: Install backend dependencies (no-dev)
        working-directory: ${{ env.BACKEND_DIR }}
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Verify production scanner and cache requirements
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          # The cPanel template is intentionally executable configuration:
          # fail the release if it regresses to the file cache or disables
          # malware scanning.
          grep -Eq '^CACHE_STORE=redis$' .env.cpanel
          grep -Eq '^REDIS_CLIENT=phpredis$' .env.cpanel
          grep -Eq '^CIP_MEDIA_SCANNER=clamav$' .env.cpanel

      - name: Stage cPanel layout
        run: |
          mkdir -p deploy/staging/cip deploy/staging/public_html/cip

          # Backend → cip/
          rsync -a \
            --exclude='tests/' --exclude='.git/' --exclude='node_modules/' \
            --exclude='storage/framework/cache/data/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='storage/logs/*' \
            --exclude='.env' \
            ${{ env.BACKEND_DIR }}/ deploy/staging/cip/

          # Copy .env.cpanel as .env (will be replaced on server)
          cp ${{ env.BACKEND_DIR }}/.env.cpanel deploy/staging/cip/.env

          # Frontend dist → public_html/cip/ (not root — root is dgisipl.com)
          cp -r ${{ env.FRONTEND_DIR }}/dist/* deploy/staging/public_html/cip/

          # cPanel deployment files
          cp deploy/public_html/.htaccess deploy/staging/public_html/.htaccess
          cp deploy/public_html/index.php deploy/staging/public_html/index.php

          echo "Staged files:"
          find deploy/staging/ -type f | wc -l
          echo "public_html contents:"
          ls deploy/staging/public_html/

      - name: Deploy to server
        run: |
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | tr -d '\r' > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          SSH_PORT="${{ secrets.DEPLOY_PORT }}"
          SSH_PORT="${SSH_PORT:-7822}"
          REMOTE="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          PHP_BIN="/opt/alt/php84/usr/bin/php"
          VERTEX_SA_LOCAL="/tmp/cip-vertex-ai.json"

          if [ -z "${{ secrets.VERTEX_SERVICE_ACCOUNT_JSON_B64 }}" ]; then
            echo "Missing GitHub secret VERTEX_SERVICE_ACCOUNT_JSON_B64."
            exit 1
          fi

          printf '%s' "${{ secrets.VERTEX_SERVICE_ACCOUNT_JSON_B64 }}" | base64 -d > "$VERTEX_SA_LOCAL"

          # Take and checksum a pre-deploy backup before mutating the live
          # release. Failure aborts deployment; the backup contains database,
          # evidence storage, code, and the existing APP_KEY separately.
          scp -P $SSH_PORT -i /tmp/deploy_key -o StrictHostKeyChecking=no -o IdentitiesOnly=yes \
            deploy/production/backup-production.sh $REMOTE:/tmp/cip-backup-production.sh
          ssh -p $SSH_PORT -i /tmp/deploy_key -o StrictHostKeyChecking=no -o IdentitiesOnly=yes \
            $REMOTE "chmod 700 /tmp/cip-backup-production.sh && export LANG=C LC_ALL=C LANGUAGE=C && APP_DIR=\$HOME/cip BACKUP_ROOT=\$HOME/cip-backups bash /tmp/cip-backup-production.sh && rm -f /tmp/cip-backup-production.sh"

          # Verify host capabilities before replacing application files. The
          # runtime readiness endpoint repeats these checks after deploy.
          ssh -p $SSH_PORT -i /tmp/deploy_key -o StrictHostKeyChecking=no -o IdentitiesOnly=yes \
            $REMOTE "export LANG=C LC_ALL=C LANGUAGE=C; set -u; \
              if $PHP_BIN -m | grep -qx redis; then \
                echo 'PHP redis extension: available'; \
              else \
                echo 'PHP redis extension: missing'; \
                exit 1; \
              fi; \
              CLAMSCAN_BIN=\$(command -v clamscan || true); \
              if [ -z \"\$CLAMSCAN_BIN\" ]; then \
                echo 'clamscan: missing'; \
                exit 1; \
              fi; \
              echo \"clamscan: \$CLAMSCAN_BIN\"; \
              \"\$CLAMSCAN_BIN\" --version; \
              CLAMSCAN_PROBE=\"/tmp/cip-clamscan-probe.\$\$\"; \
              trap 'rm -f \"\$CLAMSCAN_PROBE\"' EXIT; \
              : > \"\$CLAMSCAN_PROBE\"; \
              set +e; \"\$CLAMSCAN_BIN\" --no-summary --stdout \"\$CLAMSCAN_PROBE\"; CLAMSCAN_STATUS=\$?; set -e; \
              echo \"clamscan probe exit: \$CLAMSCAN_STATUS\"; \
              [ \"\$CLAMSCAN_STATUS\" -eq 0 ]"

          # Keep the rollback helper on the server so an operator can run a
          # code-only rollback even if the next release cannot be built.
          scp -P $SSH_PORT -i /tmp/deploy_key -o StrictHostKeyChecking=no -o IdentitiesOnly=yes \
            deploy/production/rollback-production.sh $REMOTE:/tmp/cip-rollback-production.sh
          ssh -p $SSH_PORT -i /tmp/deploy_key -o StrictHostKeyChecking=no -o IdentitiesOnly=yes \
            $REMOTE "chmod 700 /tmp/cip-rollback-production.sh && mv /tmp/cip-rollback-production.sh \$HOME/cip/rollback-production.sh"

          # Deploy backend (cip/)
          rsync -az --delete \
            --exclude='storage/' \
            --exclude='.env' \
            --exclude='.env.bak' \
            -e "ssh -p $SSH_PORT -i /tmp/deploy_key -o StrictHostKeyChecking=no -o IdentitiesOnly=yes" \
            deploy/staging/cip/ $REMOTE:~/cip/

          # Always copy the latest .env.cpanel template, then merge
          # with the existing server .env. Most keys (DB credentials,
          # APP_KEY, etc.) are preserved from the server since
          # .env.cpanel has placeholders. However, specific keys listed
          # in FORCE_UPDATE_KEYS are always overwritten from .env.cpanel
          # so that endpoint URLs, model names, and feature flags
          # propagate on every deploy.
          scp -P $SSH_PORT -i /tmp/deploy_key -o StrictHostKeyChecking=no -o IdentitiesOnly=yes \
            deploy/staging/cip/.env.cpanel $REMOTE:~/cip/.env.cpanel

          scp -P $SSH_PORT -i /tmp/deploy_key -o StrictHostKeyChecking=no -o IdentitiesOnly=yes \
            "$VERTEX_SA_LOCAL" $REMOTE:~/cip-vertex-ai.json.tmp

          ssh -p $SSH_PORT -i /tmp/deploy_key -o StrictHostKeyChecking=no -o IdentitiesOnly=yes \
            $REMOTE "mkdir -p ~/private && mv ~/cip-vertex-ai.json.tmp ~/private/cip-vertex-ai.json && chmod 600 ~/private/cip-vertex-ai.json"

          ssh -p $SSH_PORT -i /tmp/deploy_key -o StrictHostKeyChecking=no -o IdentitiesOnly=yes \
            $REMOTE "cd ~/cip && \
              if [ -f .env ]; then \
                if [ -f .env.bak ]; then \
                  CURRENT_APP_KEY=\$(grep '^APP_KEY=' .env | head -1 | cut -d'=' -f2-); \
                  BACKUP_APP_KEY=\$(grep '^APP_KEY=base64:' .env.bak | head -1 | cut -d'=' -f2-); \
                  if [ -n \"\$BACKUP_APP_KEY\" ] && [ \"\$CURRENT_APP_KEY\" != \"\$BACKUP_APP_KEY\" ]; then \
                    echo 'Restoring preserved APP_KEY from .env.bak'; \
                    sed -i \"s|^APP_KEY=.*|APP_KEY=\$BACKUP_APP_KEY|\" .env; \
                  fi; \
                fi; \
                DB_CHECK=\$(grep '^DB_DATABASE=' .env | cut -d'=' -f2-); \
                if echo \"\$DB_CHECK\" | grep -q 'YOUR_CPANEL'; then \
                  echo 'WARNING: Current .env has placeholder DB creds. Restoring from .env.bak if available.'; \
                  if [ -f .env.bak ]; then \
                    BAK_DB=\$(grep '^DB_DATABASE=' .env.bak | cut -d'=' -f2-); \
                    if ! echo \"\$BAK_DB\" | grep -q 'YOUR_CPANEL'; then \
                      echo 'Restoring .env from .env.bak (has real DB creds)'; \
                      cp .env.bak .env; \
                    fi; \
                  fi; \
                fi; \
                cp .env .env.bak; \
                cp .env.cpanel .env.tmp; \
                while IFS='=' read -r key value; do \
                  if [ -n \"\$key\" ] && grep -q \"^\$key=\" .env 2>/dev/null; then \
                    existing=\$(grep \"^\$key=\" .env | head -1 | cut -d'=' -f2-); \
                    sed -i \"s|^\$key=.*|\$key=\$existing|\" .env.tmp; \
                  fi; \
                done < .env.cpanel; \
                for force_key in AI_MODAL_BASE_URL AI_MODAL_MODEL GOOGLE_CLOUD_PROJECT AI_VERTEX_LOCATION AI_VERTEX_MODEL AI_DEFAULT_PROVIDER CIP_DEBUG_OTP; do \
                  if grep -q \"^\$force_key=\" .env.cpanel 2>/dev/null; then \
                    new_val=\$(grep \"^\$force_key=\" .env.cpanel | head -1 | cut -d'=' -f2-); \
                    sed -i \"s|^\$force_key=.*|\$force_key=\$new_val|\" .env.tmp; \
                  fi; \
                done; \
                cp .env.tmp .env; \
              else \
                cp .env.cpanel .env; \
              fi; \
              VERTEX_SA_PATH=\"\$HOME/private/cip-vertex-ai.json\"; \
              if grep -q '^GOOGLE_APPLICATION_CREDENTIALS=' .env 2>/dev/null; then \
                sed -i \"s|^GOOGLE_APPLICATION_CREDENTIALS=.*|GOOGLE_APPLICATION_CREDENTIALS=\$VERTEX_SA_PATH|\" .env; \
              else \
                echo \"GOOGLE_APPLICATION_CREDENTIALS=\$VERTEX_SA_PATH\" >> .env; \
              fi; \
              grep -q '^APP_KEY=base64:' .env || $PHP_BIN artisan key:generate --force"

          # Deploy CIP frontend to public_html/cip/ (with --delete so old
          # assets are cleaned, but scoped to cip/ so root public_html/
          # files like the company index.html are untouched).
          rsync -az --delete \
            -e "ssh -p $SSH_PORT -i /tmp/deploy_key -o StrictHostKeyChecking=no -o IdentitiesOnly=yes" \
            deploy/staging/public_html/cip/ $REMOTE:~/public_html/cip/

          # Deploy .htaccess and index.php to root (no --delete to
          # preserve existing files like the company site index.html).
          rsync -az \
            -e "ssh -p $SSH_PORT -i /tmp/deploy_key -o StrictHostKeyChecking=no -o IdentitiesOnly=yes" \
            deploy/staging/public_html/.htaccess deploy/staging/public_html/index.php $REMOTE:~/public_html/

          # Run post-deploy tasks. Production deploys must preserve
          # existing reports, users, tokens, and audit records.
          #
          # NOTE: the API host runs PHP-FPM with opcache.validate_timestamps
          # disabled, which would keep rsync'd backend code cached as stale
          # bytecode. We handle that by shipping ~/cip/public/.user.ini
          # (opcache.validate_timestamps=1), so deploys go live without an
          # FPM restart. An earlier `uapi PHP restart_php_fpm` line was
          # removed: it lived inside this double-quoted SSH string, so its
          # $(...) was expanded on the GitHub runner (uapi: command not
          # found) and never ran on the host.
          ssh -p $SSH_PORT -i /tmp/deploy_key -o StrictHostKeyChecking=no -o IdentitiesOnly=yes \
            $REMOTE "cd ~/cip && \
              mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views; \
              $PHP_BIN artisan config:clear 2>/dev/null || true; \
              $PHP_BIN artisan migrate --force; \
              $PHP_BIN artisan db:seed --class=ReportTypesSeeder --force || true; \
              $PHP_BIN artisan storage:link --force || true; \
              sleep 2; \
              $PHP_BIN artisan config:cache || true; \
              $PHP_BIN artisan route:cache || true; \
              $PHP_BIN artisan event:cache || true; \
              MEDIA_QUEUE_CMD=\"cd \$HOME/cip && flock -n \$HOME/cip/storage/framework/media-queue-worker.lock $PHP_BIN artisan queue:work --queue=media --stop-when-empty --tries=1 --timeout=180 --max-time=50 >> /dev/null 2>&1\"; \
              MEDIA_CRON_0=\"* * * * * \$MEDIA_QUEUE_CMD\"; \
              MEDIA_CRON_15=\"* * * * * sleep 15; \$MEDIA_QUEUE_CMD\"; \
              MEDIA_CRON_30=\"* * * * * sleep 30; \$MEDIA_QUEUE_CMD\"; \
              MEDIA_CRON_45=\"* * * * * sleep 45; \$MEDIA_QUEUE_CMD\"; \
              GENERAL_QUEUE_CRON=\"* * * * * cd \$HOME/cip && flock -n \$HOME/cip/storage/framework/general-queue-worker.lock $PHP_BIN artisan queue:work --queue=ai,notifications,default --stop-when-empty --tries=1 --timeout=180 --max-time=50 >> /dev/null 2>&1\"; \
              (crontab -l 2>/dev/null | grep -v 'artisan queue:work' || true; printf '%s\\n' \"\$MEDIA_CRON_0\" \"\$MEDIA_CRON_15\" \"\$MEDIA_CRON_30\" \"\$MEDIA_CRON_45\" \"\$GENERAL_QUEUE_CRON\") | crontab -; \
              echo 'Queue cron installed'; \
              $PHP_BIN artisan queue:work --queue=media,ai,notifications,default --stop-when-empty --tries=1 --timeout=180 --max-time=300 -v; \
              echo 'Post-deploy complete'"

          rm -f /tmp/deploy_key "$VERTEX_SA_LOCAL"

      - name: Deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "Deployment completed successfully"
          else
            echo "Deployment failed"
            exit 1
          fi
