name: Production Maintenance

on:
  workflow_dispatch:
    inputs:
      command:
        description: Safe maintenance command to run
        required: true
        type: choice
        options:
          - ai-reprocess-reports
      date:
        description: Report submitted date (YYYY-MM-DD)
        required: true
        type: string
      dry_run:
        description: Count matching reports without dispatching jobs
        required: true
        default: true
        type: boolean
      sync:
        description: Run jobs inline instead of queueing
        required: true
        default: false
        type: boolean

concurrency:
  group: production-maintenance
  cancel-in-progress: false

jobs:
  run:
    name: Run Production Maintenance
    runs-on: ubuntu-latest

    steps:
      - name: Guard inputs
        run: |
          if [ "${{ inputs.command }}" != "ai-reprocess-reports" ]; then
            echo "Unsupported command: ${{ inputs.command }}"
            exit 1
          fi
          if ! echo "${{ inputs.date }}" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "Invalid date. Use YYYY-MM-DD."
            exit 1
          fi

      - name: Run command over SSH
        run: |
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | tr -d '\r' > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          SSH_PORT="${{ secrets.DEPLOY_PORT }}"
          SSH_PORT="${SSH_PORT:-7822}"
          REMOTE="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          PHP_BIN="/opt/alt/php84/usr/bin/php"
          FLAGS=""

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          if [ "${{ inputs.sync }}" = "true" ]; then
            FLAGS="$FLAGS --sync"
          fi

          ssh -p "$SSH_PORT" -i /tmp/deploy_key -o StrictHostKeyChecking=no -o IdentitiesOnly=yes \
            "$REMOTE" "cd ~/cip && $PHP_BIN artisan ai:reprocess-reports --date='${{ inputs.date }}' $FLAGS"

          rm -f /tmp/deploy_key
